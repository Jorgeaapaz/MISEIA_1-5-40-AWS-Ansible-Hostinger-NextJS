stages:
  - lint
  - test
  - e2e
  - build
  - package
  - deploy

default:
  image: node:24-alpine
  tags:
    - cloudrun
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/

lint:
  stage: lint
  script:
    - npm ci
    - npm run lint

test:
  stage: test
  script:
    - npm ci
    - npm run test:ci

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run test:e2e

build:
  stage: build
  only:
    - main
  script:
    - npm ci
    - NODE_ENV=production EXPRESS_API_URL=http://api:4000 npm run build
    - cp -r public .next/standalone/public
    - cp -r .next/static .next/standalone/.next/static
  artifacts:
    paths:
      - .next/standalone/
    expire_in: 1 hour

# Images are built here (full-size CI runner), never on the small EC2
# instance itself — building on-instance previously exhausted its RAM/disk
# and made it unresponsive. The deploy job below only loads prebuilt images.
package:
  stage: package
  only:
    - main
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t aiformacion:latest -f Dockerfile .next/standalone
    - docker build -t aiformacion-api:latest -f server/Dockerfile .
    - docker save aiformacion:latest aiformacion-api:latest | gzip > images.tar.gz
  artifacts:
    paths:
      - images.tar.gz
      - docker-compose.yml
    expire_in: 1 hour

deploy:
  stage: deploy
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 600 "$EC2_SSH_KEY"
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh -i "$EC2_SSH_KEY" "$EC2_USER@$EC2_HOST" "mkdir -p ~/MISEIA140_aiformacion"
    - rsync -az
        -e "ssh -i $EC2_SSH_KEY"
        docker-compose.yml
        "$EC2_USER@$EC2_HOST:~/MISEIA140_aiformacion/"
    - rsync -az
        -e "ssh -i $EC2_SSH_KEY"
        images.tar.gz
        "$EC2_USER@$EC2_HOST:~/MISEIA140_aiformacion/images.tar.gz"
    - |
      ssh -i "$EC2_SSH_KEY" "$EC2_USER@$EC2_HOST" "cat > ~/MISEIA140_aiformacion/.env <<ENVEOF
      MONGO_ROOT_USERNAME=$MONGO_ROOT_USERNAME
      MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD
      JWT_SECRET=$JWT_SECRET
      ENVEOF"
    - ssh -i "$EC2_SSH_KEY" "$EC2_USER@$EC2_HOST"
        "cd ~/MISEIA140_aiformacion &&
         sudo docker rm -f aiformacion aiformacion-api >/dev/null 2>&1 || true &&
         gunzip -c images.tar.gz | sudo docker load &&
         rm -f images.tar.gz &&
         sudo docker compose up -d &&
         sudo docker image prune -af >/dev/null &&
         sudo docker builder prune -af >/dev/null &&
         sudo docker compose ps"
