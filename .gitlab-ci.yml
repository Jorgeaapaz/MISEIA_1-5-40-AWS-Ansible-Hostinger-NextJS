stages:
  - lint
  - test
  - build
  - deploy

default:
  image: node:24-alpine
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/

lint:
  stage: lint
  script:
    - npm ci
    - npm run lint

test:
  stage: test
  script:
    - npm ci
    - npm run test:ci

build:
  stage: build
  script:
    - npm ci
    - NODE_ENV=production npm run build
    - cp -r public .next/standalone/public
    - cp -r .next/static .next/standalone/.next/static
  artifacts:
    paths:
      - .next/standalone/
      - Dockerfile
      - docker-compose.yml
    expire_in: 1 hour

deploy:
  stage: deploy
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 600 "$EC2_SSH_KEY"
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -az --delete
        -e "ssh -i $EC2_SSH_KEY"
        .next/standalone/
        "$EC2_USER@$EC2_HOST:~/MISEIA140_aiformacion/"
    - scp -i "$EC2_SSH_KEY" Dockerfile docker-compose.yml
        "$EC2_USER@$EC2_HOST:~/MISEIA140_aiformacion/"
    - ssh -i "$EC2_SSH_KEY" "$EC2_USER@$EC2_HOST"
        "cd ~/MISEIA140_aiformacion &&
         sudo docker build -t aiformacion:latest . &&
         sudo docker stop aiformacion 2>/dev/null; sudo docker rm aiformacion 2>/dev/null;
         sudo docker run -d --name aiformacion --restart unless-stopped
           -p 3000:3000 -e NODE_ENV=production -e PORT=3000 -e HOSTNAME=0.0.0.0
           aiformacion:latest"
