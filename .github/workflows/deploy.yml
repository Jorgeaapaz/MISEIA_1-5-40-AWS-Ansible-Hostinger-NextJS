name: Build & Deploy to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run test:ci

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        run: NODE_ENV=production EXPRESS_API_URL=http://api:4000 npm run build

      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Build Docker images
        run: |
          docker build -t aiformacion:latest -f Dockerfile .next/standalone
          docker build -t aiformacion-api:latest -f server/Dockerfile .

      - name: Save and compress images for transfer
        run: docker save aiformacion:latest aiformacion-api:latest | gzip > /tmp/images.tar.gz

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Transfer compose file and pre-built images to EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p ~/MISEIA140_aiformacion"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=10" \
            docker-compose.yml \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/MISEIA140_aiformacion/"
          rsync -az --progress \
            -e "ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=10" \
            /tmp/images.tar.gz \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/MISEIA140_aiformacion/images.tar.gz"

      - name: Write production env file on EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cat > ~/MISEIA140_aiformacion/.env <<'ENVEOF'
          MONGO_ROOT_USERNAME=${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENVEOF"

      - name: Load images and restart the stack with docker compose
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd ~/MISEIA140_aiformacion && \
             sudo docker rm -f aiformacion aiformacion-api >/dev/null 2>&1 || true && \
             gunzip -c images.tar.gz | sudo docker load && \
             rm -f images.tar.gz && \
             sudo docker compose up -d && \
             sudo docker image prune -af >/dev/null && \
             sudo docker builder prune -af >/dev/null && \
             sudo docker compose ps"
