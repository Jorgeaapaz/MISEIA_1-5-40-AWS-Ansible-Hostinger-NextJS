name: Build & Deploy to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run test:ci

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        run: NODE_ENV=production npm run build

      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Next.js standalone bundle to EC2
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next/standalone/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/MISEIA140_aiformacion/"

      - name: Sync Express API source, Dockerfiles and compose file to EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p ~/MISEIA140_aiformacion/server ~/MISEIA140_aiformacion/app/data"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/MISEIA140_aiformacion/server/"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            app/data/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/MISEIA140_aiformacion/app/data/"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            Dockerfile docker-compose.yml package.json package-lock.json \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/MISEIA140_aiformacion/"

      - name: Write production env file on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cat > ~/MISEIA140_aiformacion/.env <<'ENVEOF'
          MONGO_ROOT_USERNAME=${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENVEOF"

      - name: Build images and restart the stack with docker compose
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd ~/MISEIA140_aiformacion && \
             sudo docker rm -f aiformacion >/dev/null 2>&1 || true && \
             sudo docker build -t aiformacion:latest . && \
             sudo docker compose build api && \
             sudo docker compose up -d && \
             sudo docker compose ps"
