name: Build & Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run test:ci

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        run: NODE_ENV=production npm run build

      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync standalone bundle to EC2
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next/standalone/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/MISEIA140_aiformacion/"

      - name: Copy Dockerfile and docker-compose to EC2
        run: |
          scp -i ~/.ssh/deploy_key Dockerfile docker-compose.yml \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/MISEIA140_aiformacion/"

      - name: Build Docker image and restart container on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd ~/MISEIA140_aiformacion && \
             sudo docker build -t aiformacion:latest . && \
             sudo docker stop aiformacion 2>/dev/null; sudo docker rm aiformacion 2>/dev/null; \
             sudo docker run -d --name aiformacion --restart unless-stopped \
               -p 3000:3000 -e NODE_ENV=production -e PORT=3000 -e HOSTNAME=0.0.0.0 \
               aiformacion:latest && \
             sudo docker ps | grep aiformacion"
